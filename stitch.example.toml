# Stitch config for naira-maker (Celo mainnet, cNGN/USDT).
# Run `npm start` with QUOTE_SINK=feed first so the feed below is live.
# Addresses from docs.textilecredit.com/protocol/address-book. Verify before funding.
chain_id = 42220
rpc_url = "https://forno.celo.org"
indexer_url = "https://api.textilecredit.com"
tick_interval_secs = 5
book_enabled = false          # RFQ only
permit2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3"
reactor = "0xa9AA0a64769cBed4d3B1Ceb4Df01CdE915C235b3"  # LimitOrderReactor

[feed]
url = "http://127.0.0.1:8787"  # FeedSink: { price (USDT per cNGN), timestamp, degraded }
staleness_secs = 30

[[pools]]
collateral = "0xF6829D7393dAe24509eb1E52eE8e572e2E271a4f"  # cNGN, 6dp
collateral_decimals = 6
debt = "0x48065fbBE25f71C9282ddf5e1cD6D6A887483D5e"        # USDT, 6dp
debt_decimals = 6
# Static per-side spread, whole bps only (u32); restart to change.
# Sell side is wide on purpose: cNGN is scarce and takers pay up for it.
buy_offset_bps = 2
sell_offset_bps = 30
buy_min_slice_debt = "10000000"
buy_max_orders = 40
sell_min_slice_debt = "10000000"
sell_max_orders = 40
ttl_secs = 120            # ladder-only, required by the parser
refresh_threshold_bps = 10
# Fixed caps in atomic units (6dp): 150 USDT / 150 USDT worth of cNGN. Not "max".
buy_total_liquidity_debt = "150000000"
sell_total_liquidity_collateral = "150000000000"  # cNGN atomic; adjust to ~150 USDT at current mid

[erc8004]
agent_id = 9995  # registered by `stitch register`
